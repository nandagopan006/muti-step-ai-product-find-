# ==============================================================================
# CI Pipeline: AI Product Finder
# Runs Django backend tests and Vite frontend build on every PR and push to main
# ==============================================================================

name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Job 1: Backend — Python / Django Tests
  # ============================================================================
  backend-tests:
    name: 🐍 Backend Tests (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 📦 Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ matrix.python-version }}-

      - name: 📥 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Run Django test suite
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
          OPENROUTER_API_KEY: ""
          DEBUG: "True"
        run: python manage.py test products --verbosity=2

  # ============================================================================
  # Job 2: Frontend — Node.js / Vite Build
  # ============================================================================
  frontend-build:
    name: ⚛️ Frontend Build (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    strategy:
      matrix:
        node-version: ["18", "20"]

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📗 Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install npm dependencies
        run: npm ci

      - name: 🏗️ Build production bundle
        run: npm run build

      - name: 📊 Report bundle size
        run: |
          echo "## 📦 Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          du -sh dist/assets/* >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
